# ============================================================================
# DEVELOPMENT infrastructure only — Postgres, MinIO, Mailpit.
# Started by `bun run setup` / `bun run dev`; the app itself runs on the host
# via `bun run dev`, so there is NO app service here.
#
# This file uses insecure defaults (postgres/password, minioadmin), publishes
# datastore ports on localhost, and makes the upload bucket world-readable —
# all fine for local development, NOT safe on an internet-facing host.
#
# To self-host Quackback, use docker-compose.prod.yml instead (app included,
# hardened defaults). See the self-hosting docs.
# ============================================================================

services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: quackback-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: quackback
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-pgcron.sql:/docker-entrypoint-initdb.d/init-pgcron.sql
    command: postgres -c shared_preload_libraries=pg_cron -c cron.database_name=quackback -c max_connections=200
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # Materializa a licença do AIStor: MINIO_LICENSE (do .env) vira o arquivo que
  # o server lê com --license. Precisa rodar ANTES do minio, por isso é um
  # serviço separado. Sem licença válida o AIStor sobe em offline mode e nega
  # toda operação S3 — o app abre, mas nenhum upload funciona.
  minio-license:
    image: quay.io/minio/aistor/mc:RELEASE.2026-09-06T02-44-40Z
    container_name: quackback-minio-license
    environment:
      MINIO_LICENSE: ${MINIO_LICENSE:-}
    entrypoint: >
      /bin/sh -c "
        if [ -z \"$${MINIO_LICENSE}\" ]; then
          echo 'AVISO: MINIO_LICENSE vazia no .env — o AIStor sobe em offline mode e nega toda operacao S3.';
        fi;
        printf '%s' \"$${MINIO_LICENSE}\" > /license/minio.license;
        echo 'licenca materializada em /license/minio.license'; exit 0;
      "
    volumes:
      - minio_license:/license
    restart: 'no'

  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-07T08-39-31Z
    container_name: quackback-minio
    restart: unless-stopped
    depends_on:
      minio-license:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
      - minio_license:/license:ro
    command: server /data --address ":9000" --console-address ":9001" --license /license/minio.license
    healthcheck:
      # /ready e não /live: sem licença válida o server continua vivo e responde
      # 200 em /live enquanto nega 100% das operações S3. Só /ready distingue os
      # dois casos (200 licenciado, 503 offline). start_period alto porque o
      # primeiro boot formata o pool antes de abrir a porta.
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/ready || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  mailpit:
    image: axllent/mailpit:latest
    container_name: quackback-mailpit
    restart: unless-stopped
    ports:
      - '8025:8025' # Web UI
      - '1025:1025' # SMTP
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8025/api/v1/info']
      interval: 5s
      timeout: 5s
      retries: 5

  # Creates MinIO bucket and sets public download policy on startup
  minio-init:
    image: quay.io/minio/aistor/mc:RELEASE.2026-09-06T02-44-40Z
    container_name: quackback-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/quackback --ignore-existing;
      mc anonymous set download local/quackback;
      exit 0;
      "
    restart: 'no'

volumes:
  postgres_data:
  minio_data:
  # Arquivo de licença materializado pelo serviço minio-license.
  minio_license:
