# Reviews this repository's PRs with the ywap-review-workflow installed globally
# on the self-hosted `claude-review` runner. This repo does not vendor .review/,
# .claude/ or .mcp.json — `ywap-review-pr` on the runner resolves the target,
# renders the CI prompt and invokes Claude Code.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    # Manual trigger: comment `/review` on a PR (trusted authors only — see `if`).
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  claude-review:
    name: Claude Code review
    # pull_request: skip drafts; self-hosted runner never touches fork PRs
    # automatically. issue_comment: `/review` on a PR from OWNER/MEMBER/
    # COLLABORATOR only — arbitrary commenters must not schedule runner work.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: [self-hosted, linux, claude-review]
    timeout-minutes: 90

    env:
      GH_TOKEN: ${{ github.token }}
      REVIEW_AUTO_PUBLISH: 'false'
      CLAUDE_CODE_ENABLE_TELEMETRY: '0'
      CLAUDE_REVIEW_LABEL: review/claude-reviewing

    steps:
      - name: Resolve and gate PR target
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            gh pr view "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" \
              --json headRefOid,headRepositoryOwner > /tmp/pr-target.json
            HEAD_OWNER="$(jq -r .headRepositoryOwner.login /tmp/pr-target.json)"
            if [ "$HEAD_OWNER" != "$GITHUB_REPOSITORY_OWNER" ]; then
              echo "::error::/review refused: PR head comes from fork '$HEAD_OWNER' — self-hosted runner never checks out untrusted code with repo secrets."
              exit 1
            fi
            echo "head_sha=$(jq -r .headRefOid /tmp/pr-target.json)" >> "$GITHUB_OUTPUT"
          else
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          # Never leave a token in .git/config: only gh (via GH_TOKEN) talks to GitHub.
          persist-credentials: false
          # Pin the resolved head SHA — a fork PR is refused above, and a moving
          # refs/pull/N/head could change between gate and checkout.
          ref: ${{ steps.resolve.outputs.head_sha }}

      - name: Run Claude Code review
        env:
          # Repo secret; alternative: `claude` auth persisted in the runner's /home/runner volume.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ATLASSIAN_SITE: ${{ secrets.ATLASSIAN_SITE }}
        run: ywap-review-pr

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: review-artifacts/current/
          if-no-files-found: warn
